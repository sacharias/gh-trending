<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mercury GitHub Radar</title>
  <style>
    :root {
      color-scheme: light;
      --background: #fafafa;
      --panel: #ffffff;
      --ink: #171717;
      --muted: #737373;
      --muted-strong: #525252;
      --border: #e5e5e5;
      --border-strong: #d4d4d4;
      --hover: #f5f5f5;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --good: #047857;
      --danger: #b45309;
      --shadow: 0 1px 2px rgba(0, 0, 0, .04);
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 136px; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .wrap {
      width: min(100%, 1240px);
      margin: 0 auto;
      padding: 0 12px;
    }
    header {
      border-bottom: 1px solid var(--border);
      background: rgba(250, 250, 250, .92);
      backdrop-filter: blur(12px);
    }
    .mast {
      display: grid;
      gap: 12px;
      padding: 22px 12px 16px;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.08;
      letter-spacing: 0;
    }
    .subhead {
      max-width: 760px;
      margin: 0;
      color: var(--muted-strong);
      font-size: 14px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 30px;
    }
    .pill,
    .badge {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted-strong);
      font-size: 12px;
      font-weight: 600;
    }
    .pill { min-height: 28px; padding: 4px 9px; }
    .badge { min-height: 24px; padding: 3px 8px; }
    .badge.rising {
      border-color: #fed7aa;
      background: #fff7ed;
      color: #9a3412;
    }
    .badge.velocity {
      border-color: #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
    }
    main { padding: 0 0 36px; }
    .controls-shell {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 -12px;
      border-bottom: 1px solid var(--border);
      background: rgba(250, 250, 250, .94);
      backdrop-filter: blur(12px);
    }
    .controls {
      display: grid;
      gap: 10px;
      padding: 10px 12px;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--hover);
      padding: 3px;
    }
    .tab {
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted-strong);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
    }
    .tab[aria-pressed="true"] {
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .tools {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .field {
      min-height: 38px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }
    input.field { padding: 0 12px; }
    select.field { padding: 0 10px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .overview {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 0 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .repo-table {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    .table-head { display: none; }
    .repo-row {
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .repo-row:first-of-type { border-top: 0; }
    .repo-row[open] { background: #fcfcfc; }
    .repo-summary {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 9px;
      min-height: 74px;
      padding: 10px 11px;
      cursor: pointer;
      list-style: none;
    }
    .repo-summary::-webkit-details-marker { display: none; }
    .repo-summary:hover { background: var(--hover); }
    .rank {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 24px;
      text-align: right;
    }
    .repo-main {
      display: grid;
      min-width: 0;
      gap: 7px;
    }
    .repo-name-line {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 8px;
    }
    .repo-name {
      overflow: hidden;
      color: var(--ink);
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .repo-name:hover { color: var(--accent); }
    .chevron {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      transition: transform .16s ease;
    }
    .repo-row[open] .chevron { transform: rotate(90deg); }
    .mobile-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .metric {
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      line-height: 1.15;
    }
    .metric strong {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .desktop-cell { display: none; }
    .repo-detail {
      display: grid;
      gap: 12px;
      padding: 0 11px 14px 54px;
      color: var(--muted-strong);
    }
    .summary-text {
      margin: 0;
      color: #262626;
      font-size: 14px;
    }
    .detail-meta,
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .links a {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      padding: 5px 10px;
      background: var(--panel);
      color: var(--ink);
      font-size: 13px;
      font-weight: 650;
    }
    .links a:hover {
      border-color: #93c5fd;
      color: var(--accent);
    }
    .empty,
    .error {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      padding: 18px;
      color: var(--muted-strong);
      font-weight: 600;
    }
    .error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }
    footer {
      border-top: 1px solid var(--border);
      padding: 22px 0 30px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (min-width: 700px) {
      .wrap { padding: 0 20px; }
      .mast { padding: 32px 20px 22px; }
      h1 { font-size: 38px; }
      .controls-shell { margin: 0 -20px; }
      .controls {
        grid-template-columns: auto minmax(360px, 1fr);
        align-items: center;
        padding: 12px 20px;
      }
      .tabs {
        width: max-content;
        min-width: 420px;
      }
      .tools {
        grid-template-columns: minmax(220px, 1fr) 180px;
        justify-self: end;
        width: min(100%, 560px);
      }
      .table-head,
      .repo-summary {
        display: grid;
        grid-template-columns: 58px minmax(250px, 1.8fr) 90px 100px 88px 88px 120px 170px;
        gap: 10px;
        align-items: center;
      }
      .table-head {
        min-height: 40px;
        border-bottom: 1px solid var(--border);
        background: #fafafa;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        padding: 0 14px;
      }
      .repo-summary {
        min-height: 56px;
        padding: 0 14px;
      }
      .rank { text-align: left; }
      .repo-main { gap: 2px; }
      .mobile-metrics { display: none; }
      .desktop-cell {
        display: block;
        min-width: 0;
        overflow: hidden;
        color: var(--muted-strong);
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .desktop-cell.hot { color: var(--danger); }
      .desktop-cell.good { color: var(--good); }
      .repo-detail {
        padding: 0 14px 16px 322px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap mast">
      <div class="eyebrow">Mercury GitHub Radar</div>
      <h1>All tracked repos</h1>
      <p class="subhead">A compact radar for new GitHub momentum. Scan every tracked repo first, then tap or click a row for the README summary and links.</p>
      <div class="stats" id="stats"></div>
    </div>
  </header>
  <main class="wrap">
    <section class="controls-shell" aria-label="Repository controls">
      <div class="controls">
        <div class="tabs" role="group" aria-label="Filter repositories">
          <button class="tab" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="tab" type="button" data-filter="fastest">Fastest Rising</button>
          <button class="tab" type="button" data-filter="velocity">Highest Velocity</button>
        </div>
        <div class="tools">
          <label class="sr-only" for="search">Search repositories</label>
          <input class="field" id="search" type="search" placeholder="Search repos, language, summary">
          <label class="sr-only" for="sort">Sort repositories</label>
          <select class="field" id="sort">
            <option value="rank">Sort by rank</option>
            <option value="rising">Sort by rising %</option>
            <option value="velocity">Sort by stars/day</option>
            <option value="recent">Sort by recent stars</option>
            <option value="total">Sort by total stars</option>
            <option value="name">Sort by repo name</option>
          </select>
        </div>
      </div>
    </section>
    <div class="overview" id="overview"></div>
    <div id="app"></div>
  </main>
  <footer>
    <div class="wrap">Generated from public GitHub WatchEvent data. README summaries are heuristic and cached between runs.</div>
  </footer>
  <script>
    const compactFmt = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
    const intFmt = new Intl.NumberFormat("en");
    const state = { filter: "all", query: "", sort: "rank", repos: [] };

    function pctLabel(repo) {
      if (repo.stars_prev < 3 || repo.pct_change === 9999) return "+inf";
      return repo.pct_change > 0 ? `+${repo.pct_change}%` : `${repo.pct_change}%`;
    }

    function pctSortValue(repo) {
      if (repo.stars_prev < 3 || repo.pct_change === 9999) return Number.POSITIVE_INFINITY;
      return Number(repo.pct_change) || 0;
    }

    function sectionBadges(repo) {
      return repo.sections.map(section => {
        const className = section === "Fastest Rising" ? "rising" : "velocity";
        return `<span class="badge ${className}">${section}</span>`;
      }).join("");
    }

    function buildRepos(data) {
      const repos = new Map();
      function addRows(rows, section) {
        (rows || []).forEach((repo, index) => {
          const key = repo.repo_name;
          if (!repos.has(key)) {
            repos.set(key, { ...repo, sections: [], ranks: {}, allRank: repos.size + 1 });
          }
          const merged = repos.get(key);
          if (!merged.sections.includes(section)) merged.sections.push(section);
          merged.ranks[section] = index + 1;
        });
      }
      addRows(data.fastest_rising, "Fastest Rising");
      addRows(data.highest_velocity, "Highest Velocity");
      return Array.from(repos.values());
    }

    function repoMatches(repo) {
      if (state.filter === "fastest" && !repo.sections.includes("Fastest Rising")) return false;
      if (state.filter === "velocity" && !repo.sections.includes("Highest Velocity")) return false;
      if (!state.query) return true;
      const haystack = [
        repo.repo_name,
        repo.language,
        repo.description,
        repo.readme_summary,
        repo.sections.join(" ")
      ].join(" ").toLowerCase();
      return haystack.includes(state.query);
    }

    function sortRepos(rows) {
      const sorted = [...rows];
      const byRank = (repo) => {
        if (state.filter === "fastest") return repo.ranks["Fastest Rising"] || 9999;
        if (state.filter === "velocity") return repo.ranks["Highest Velocity"] || 9999;
        return repo.allRank;
      };
      sorted.sort((a, b) => {
        if (state.sort === "name") return a.repo_name.localeCompare(b.repo_name);
        if (state.sort === "rising") return pctSortValue(b) - pctSortValue(a) || byRank(a) - byRank(b);
        if (state.sort === "velocity") return Number(b.velocity) - Number(a.velocity) || byRank(a) - byRank(b);
        if (state.sort === "recent") return Number(b.stars_recent) - Number(a.stars_recent) || byRank(a) - byRank(b);
        if (state.sort === "total") return Number(b.total_stars) - Number(a.total_stars) || byRank(a) - byRank(b);
        return byRank(a) - byRank(b);
      });
      return sorted;
    }

    function repoRow(repo, index) {
      const url = `https://github.com/${encodeURIComponent(repo.repo_name).replace("%2F", "/")}`;
      const summary = repo.readme_summary || repo.description || "No README summary available.";
      const language = repo.language || "Unknown";
      const readmeLink = repo.readme_url ? `<a href="${escapeAttr(repo.readme_url)}">README</a>` : "";
      const visibleRank = index + 1;
      return `<details class="repo-row">
        <summary class="repo-summary">
          <span class="rank">${visibleRank}</span>
          <span class="repo-main">
            <span class="repo-name-line">
              <span class="repo-name">${escapeHtml(repo.repo_name)}</span>
              <span class="chevron" aria-hidden="true">&rsaquo;</span>
            </span>
            <span class="mobile-metrics" aria-label="Repository metrics">
              <span class="metric">Rising <strong>${pctLabel(repo)}</strong></span>
              <span class="metric">Stars/day <strong>${escapeHtml(repo.velocity)}</strong></span>
              <span class="metric">Recent <strong>${compactFmt.format(repo.stars_recent)}</strong></span>
            </span>
          </span>
          <span class="desktop-cell hot">${pctLabel(repo)}</span>
          <span class="desktop-cell good">${escapeHtml(repo.velocity)}</span>
          <span class="desktop-cell">${intFmt.format(repo.stars_recent)}</span>
          <span class="desktop-cell">${compactFmt.format(repo.total_stars)}</span>
          <span class="desktop-cell">${escapeHtml(language)}</span>
          <span class="desktop-cell">${sectionBadges(repo)}</span>
        </summary>
        <div class="repo-detail">
          <p class="summary-text">${escapeHtml(summary)}</p>
          <div class="detail-meta">
            <span class="pill">${intFmt.format(repo.total_stars)} total stars</span>
            <span class="pill">${intFmt.format(repo.stars_prev)} previous stars</span>
            <span class="pill">${escapeHtml(language)}</span>
            ${sectionBadges(repo)}
          </div>
          <div class="links">
            <a href="${url}">Repository</a>
            ${readmeLink}
          </div>
        </div>
      </details>`;
    }

    function render() {
      const filtered = sortRepos(state.repos.filter(repoMatches));
      const label = state.filter === "fastest"
        ? "fastest rising"
        : state.filter === "velocity"
          ? "highest velocity"
          : "tracked";
      document.getElementById("overview").innerHTML = `
        <span>${filtered.length} ${label} repos</span>
        <span>${state.query ? "Filtered by search" : "Tap a row for the summary"}</span>`;
      document.getElementById("app").innerHTML = filtered.length
        ? `<section class="repo-table" aria-label="All tracked repositories">
            <div class="table-head" aria-hidden="true">
              <span>Rank</span>
              <span>Repo</span>
              <span>Rising %</span>
              <span>Stars/day</span>
              <span>Recent</span>
              <span>Total</span>
              <span>Language</span>
              <span>Section</span>
            </div>
            ${filtered.map(repoRow).join("")}
          </section>`
        : `<div class="empty">No repositories match the current filters.</div>`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    fetch("data.json", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error(`Unable to load data.json (${response.status})`);
        return response.json();
      })
      .then(data => {
        state.repos = buildRepos(data);
        document.getElementById("stats").innerHTML = `
          <span class="pill">Updated ${new Date(data.generated_at).toLocaleString()}</span>
          <span class="pill">${data.window_days}-day window</span>
          <span class="pill">${state.repos.length} unique repos</span>
          <span class="pill">${data.min_recent}+ recent stars</span>`;
        document.querySelectorAll(".tab").forEach(button => {
          button.addEventListener("click", () => {
            state.filter = button.dataset.filter;
            document.querySelectorAll(".tab").forEach(tab => {
              tab.setAttribute("aria-pressed", String(tab === button));
            });
            render();
          });
        });
        document.getElementById("search").addEventListener("input", event => {
          state.query = event.target.value.trim().toLowerCase();
          render();
        });
        document.getElementById("sort").addEventListener("change", event => {
          state.sort = event.target.value;
          render();
        });
        render();
      })
      .catch(error => {
        document.getElementById("app").innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      });
  </script>
</body>
</html>
