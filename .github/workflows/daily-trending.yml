name: Daily Trending

on:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/daily-trending.yml'
  workflow_dispatch:

jobs:
  trending:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install gh-trending
        run: uv tool install .

      - name: Generate trending data
        id: gen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh-trending --json > /tmp/data.json
          # Only overwrite committed data.json if the new output is non-empty
          # and valid JSON with at least one ranking populated.
          python3 - <<'EOF'
          import json, sys
          with open('/tmp/data.json') as f:
              d = json.load(f)
          if not (d.get('fastest_rising') or d.get('highest_velocity')):
              sys.exit("empty rankings")
          EOF
          mv /tmp/data.json docs/data.json

      - name: Commit and push
        if: steps.gen.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update trending repos [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

      - name: Fail job if data generation failed
        if: steps.gen.outcome != 'success'
        run: |
          echo "Data generation failed; deployed existing docs/data.json as fallback."
          exit 1
