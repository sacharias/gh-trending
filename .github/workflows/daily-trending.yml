name: Daily Trending

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: Europe/Stockholm
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mercury_gh_radar/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/daily-trending.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  trending:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install gh-trending
        run: uv tool install .

      - name: Generate trending data
        id: gen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh-trending --json > /tmp/data.json
          # Do not replace a healthy dashboard with a suspiciously small result
          # if the upstream event feed is incomplete.
          python3 - <<'EOF'
          import json, sys
          with open('/tmp/data.json') as f:
              d = json.load(f)
          minimum = min(10, d.get('top', 25))
          for ranking in ('fastest_rising', 'highest_velocity'):
              count = len(d.get(ranking, []))
              if count < minimum:
                  sys.exit(f"{ranking} has only {count} repos; expected at least {minimum}")
          EOF
          mv /tmp/data.json docs/data.json

      - name: Commit and push
        if: steps.gen.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update trending repos [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Fail job if data generation failed
        if: steps.gen.outcome != 'success'
        run: |
          echo "Data generation failed; deployed existing docs/data.json as fallback."
          exit 1
